# Default configuration file
# This file is intended as a user-facing manual.
# Modify the values below according to your dataset, model, and evaluation setup.

device: auto
# Options:
#   auto  : use cuda if available, else mps if available, else cpu
#   cpu   : force CPU
#   cuda  : force NVIDIA GPU
#   mps   : force Apple Silicon GPU

data:
  name: MVTec
  # Options:
  #   MVTec
  #   Cobots_Synthetic
  #   Robotics_Hazards
  #   custom

  dataset_root: "/path/to/dataset"
  # Example:
  #   "/home/user/data/raw/mvtec_anomaly_detection"

  category: zipper
  # For MVTec examples:
  #   bottle, cable, capsule, carpet, grid, hazelnut, leather,
  #   metal_nut, pill, screw, tile, toothbrush, transistor, wood, zipper

  img_size: 128
  batch_size: 16
  num_workers: 0
  pin_memory: false

  augmentation: light
  # Options:
  #   none
  #   light
  #   strong

model:
  name: vaegan
  # Options:
  #   vaegan

  checkpoint_root: "models/vaegan"
  latent_dim: 64

  pretrained: true
  # true  : load pretrained checkpoint if available
  # false : train from scratch

  recon_loss: BCE
  # Options:
  #   BCE
  #   MSE
  #   L1

  adversarial_loss: MSE
  # Options:
  #   MSE
  #   BCE

training:
  epochs: 1000
  learning_rate_enc_dec: 0.001
  learning_rate_dis: 0.0001
  beta_kl: 0.0001
  beta_gan: 0.0001
  beta_center: 0.0
  beta_svdd: 0.0
  svdd_radius: 0.0
  svdd_nu: 0.1
  save_every: 1

scoring:
  method: embedding_kmeans
  n_clusters: 8
  n_neighbors: 5
  metric: euclidean
  aggregation: mean
  # Options:
  #   embedding_kmeans
  #   embedding_knn

  quantiles: [0.5, 0.75, 0.9, 0.95, 0.99]
  # Used when the scoring method produces multiple score levels.

threshold:
  method: single_point
  # Options:
  #   single_point
  #   multi_point

  percentile: 95
  # Threshold is computed from normal training scores.
  # Common values:
  #   90, 95, 97.5, 99

  decision_rule: any
  # Used only with multi_point thresholding.
  # Options:
  #   any      : anomaly if at least one score exceeds the threshold
  #   all      : anomaly if all scores exceed the threshold
  #   majority : anomaly if more than half of scores exceed the threshold

output:
  dir: results/
  save_scores: true
  save_predictions: true
  save_metrics: true
  save_config: true
